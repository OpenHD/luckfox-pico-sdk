name: Build sdcard image for luckfox pico

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-sdcard:
    runs-on: ubuntu-latest
    env:
      OPENHD_SUBMODULE_TOKEN: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}
      DOWNLOAD_KEY: ${{ secrets.DOWNLOAD_KEY }}
      DOWNLOAD_URL: ${{ secrets.DOWNLOAD_URL }}
    strategy:
      fail-fast: false
      matrix:
        target: [luckfox, rv1103, rv1106, aura, lyra, luckfox_picoA]
        include:
          - target: luckfox
            lunch_option: 1
          - target: rv1103
            lunch_option: 1
          - target: aura
            lunch_option: 1
          - target: lyra
            lunch_option: 1
          - target: luckfox_picoA
            lunch_option: 1
          - target: rv1106
            lunch_option: 4

    container:
      image: debian:bookworm

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            sudo ca-certificates git xz-utils build-essential bash git ssh make gcc gcc-multilib g++-multilib module-assistant expect g++ gawk texinfo libssl-dev bison flex fakeroot cmake unzip gperf autoconf device-tree-compiler libncurses5-dev pkg-config bc python-is-python3 passwd openssl openssh-server openssh-client vim file cpio rsync wget curl genimage mtools dosfstools pipx zip
          echo "ALL ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/github-actions

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout OpenHD openhd-3.0 with private submodules
        uses: actions/checkout@v4
        with:
          repository: OpenHD/OpenHD
          ref: dev-release
          path: openhd-src
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.OPENHD_SUBMODULE_TOKEN }}

      - name: Ensure private OpenHD sources are present
        shell: bash
        run: |
          set -e

          git -C openhd-src submodule sync --recursive
          git -C openhd-src submodule update --init --recursive

          if [ ! -f openhd-src/OpenHD/ohd_interface/video_crypto_private/CMakeLists.txt ]; then
            echo "Private submodule content missing, updating to origin/main..."
            git -C openhd-src/OpenHD/ohd_interface/video_crypto_private fetch origin main
            git -C openhd-src/OpenHD/ohd_interface/video_crypto_private checkout -f origin/main
          fi

          test -f openhd-src/OpenHD/ohd_interface/video_crypto_private/CMakeLists.txt
          git -C openhd-src/OpenHD/ohd_interface/video_crypto_private rev-parse HEAD

      - name: Prepare private Artosyn SDK
        shell: bash
        env:
          ARTLINK_REPO: https://github.com/OpenHD-Technologies/OpenHD-ArtLink.git
          ARTLINK_GIT_AUTH_USERNAME: raphael@openhdfpv.org
          ARTLINK_GIT_AUTH: raphael@openhdfpv.org:${{ secrets.OPENHD_SUBMODULE_TOKEN }}
        run: |
          set -e

          sdk_root="${{ github.workspace }}/openhd-private/artosyn_sdk"
          auth_b64="$(printf '%s' "${ARTLINK_GIT_AUTH}" | base64 | tr -d '\n')"

          rm -rf "${sdk_root}"
          mkdir -p "$(dirname "${sdk_root}")"
          GIT_TERMINAL_PROMPT=0 git \
            -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth_b64}" \
            clone --quiet "${ARTLINK_REPO}" "${sdk_root}"

          if [ ! -d "${sdk_root}/host_drv/app/ar8030" ] || [ ! -d "${sdk_root}/host_drv/com" ]; then
            echo "Artosyn SDK layout is incomplete"
            find "${sdk_root}" -maxdepth 3 -type d | sort
            exit 1
          fi

          echo "Artosyn SDK root: ${sdk_root}"
          find "${sdk_root}" -type f \( -name "libar8030_client.a" -o -name "libar8030_client.so" -o -name "libcom.a" \) -print || true

          {
            echo "OPENHD_LOCAL_SITE=${{ github.workspace }}/openhd-src"
            echo "ARTOSYN_SDK_ROOT=${sdk_root}"
          } >> "$GITHUB_ENV"

      - name: Run build steps (${{ matrix.target }})
        shell: bash
        run: |
          set -e

          echo -e "${{ matrix.lunch_option }}\n0\n0" | ./build.sh lunch

          ./build.sh media
          ./build.sh
          ./finish-ohd.sh

      - name: Compress sdcard.img (${{ matrix.target }})
        run: |
          set -e
          cd output/genimage

          if [ ! -f sdcard.img ]; then
            echo "sdcard.img NOT FOUND!"
            ls -R .
            exit 1
          fi

          # Compress and rename per target
          xz -T0 -9 -f sdcard.img
          mv sdcard.img.xz sdcard-${{ matrix.target }}.img.xz

      - name: Upload image artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: sdcard-img-${{ matrix.target }}
          path: output/genimage/sdcard-${{ matrix.target }}.img.xz
          if-no-files-found: error
      - name: Package Firmware and OHD Root (${{ matrix.target }})
        run: |
          set -e
          echo "DT=$(date -u +'%Y-%m-%d-%H-%M-%S')" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/deploy"
          
          ZIP_NAME="openhd-${{ matrix.target }}-firmware.zip"
          TAR_NAME="openhd-${{ matrix.target }}-ohd-root.tar.gz"
          
          # Package firmware images (boot.img, rootfs.img, etc)
          if [ -d "output/image" ]; then
            cd output/image
            zip -r "$GITHUB_WORKSPACE/deploy/$ZIP_NAME" .
            cd "$GITHUB_WORKSPACE"
          else
            echo "output/image NOT FOUND!"
            exit 1
          fi
          
          # Package sysroot (rootfs contents)
          ROOTFS_DIR=$(find output/out -maxdepth 1 -type d -name "rootfs_*" | head -n 1)
          if [ -n "$ROOTFS_DIR" ] && [ -d "$ROOTFS_DIR" ]; then
            cd "$ROOTFS_DIR"
            tar -czf "$GITHUB_WORKSPACE/deploy/$TAR_NAME" .
            cd "$GITHUB_WORKSPACE"
          else
            echo "Rootfs directory NOT FOUND in output/out!"
            exit 1
          fi
          
          cd "$GITHUB_WORKSPACE/deploy"
          sha256sum "$ZIP_NAME" > "$ZIP_NAME.sha256"
          sha256sum "$TAR_NAME" > "$TAR_NAME.sha256"
          
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "TAR_NAME=$TAR_NAME" >> "$GITHUB_ENV"

      - name: Package OpenHD and SysUtils components
        run: |
          set -e
          
          ROOTFS_DIR=$(find output/out -maxdepth 1 -type d -name "rootfs_*" | head -n 1)
          if [ -z "$ROOTFS_DIR" ]; then
            echo "Rootfs directory NOT FOUND!"
            exit 1
          fi
          
          # Create openhd component
          mkdir -p openhd-comp/usr/bin openhd-comp/usr/lib
          cp "$ROOTFS_DIR/usr/bin/openhd" openhd-comp/usr/bin/ || true
          
          cat > openhd-comp/component-manifest.json <<          EOF
          {
            "schema": 1,
            "component": "openhd",
            "component_version": "3.0.0",
            "package_version": "3.0.0",
            "platform": "luckfox",
            "architecture": "arm",
            "sdk_sha256": "unknown",
            "sdk_buildroot_commit": "unknown"
          }
          EOF
          (cd openhd-comp && find . -type f ! -name sha256sums -print0 | sort -z | xargs -0 sha256sum >sha256sums)
          tar -czf "/deploy/openhd-${{ matrix.target }}-latest.tar.gz" -C openhd-comp .
          
          # Create sysutils component
          mkdir -p sysutils-comp/usr/bin
          cp "$ROOTFS_DIR/usr/bin/openhd_sys_utils" sysutils-comp/usr/bin/ || true
          
          cat > sysutils-comp/component-manifest.json <<          EOF
          {
            "schema": 1,
            "component": "openhd-sys-utils",
            "component_version": "1.0.0",
            "package_version": "1.0.0",
            "platform": "luckfox",
            "architecture": "arm",
            "sdk_sha256": "unknown",
            "sdk_buildroot_commit": "unknown"
          }
          EOF
          (cd sysutils-comp && find . -type f ! -name sha256sums -print0 | sort -z | xargs -0 sha256sum >sha256sums)
          tar -czf "/deploy/openhd-sys-utils-${{ matrix.target }}-latest.tar.gz" -C sysutils-comp .
          
          cd "/deploy"
          sha256sum "openhd-${{ matrix.target }}-latest.tar.gz" > "openhd-${{ matrix.target }}-latest.tar.gz.sha256"
          sha256sum "openhd-sys-utils-${{ matrix.target }}-latest.tar.gz" > "openhd-sys-utils-${{ matrix.target }}-latest.tar.gz.sha256"
          
          echo "OHD_COMP=openhd-${{ matrix.target }}-latest.tar.gz" >> ""
          echo "SYS_COMP=openhd-sys-utils-${{ matrix.target }}-latest.tar.gz" >> ""
      - name: Upload Firmware Artifacts (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: firmware-and-root-${{ matrix.target }}
          path: |
            deploy/${{ env.ZIP_NAME }}
            deploy/${{ env.ZIP_NAME }}.sha256
            deploy/${{ env.TAR_NAME }}
            deploy/${{ env.TAR_NAME }}.sha256
          if-no-files-found: error

      - name: Install Cloudsmith CLI
        run: pipx install cloudsmith-cli

      - name: Publish to Cloudsmith (${{ matrix.target }})
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: |
          : "${CLOUDSMITH_API_KEY:?CLOUDSMITH_API_KEY secret is required to publish}"
          
          cloudsmith push raw --republish \
            --name "openhd-${{ matrix.target }}-firmware" \
            --version "$DT" \
            openhd/dev-release "deploy/$ZIP_NAME"
            
          cloudsmith push raw --republish \
            --name "openhd-${{ matrix.target }}-firmware-sha256" \
            --version "$DT" \
            openhd/dev-release "deploy/$ZIP_NAME.sha256"
            
          cloudsmith push raw --republish \
            --name "openhd-${{ matrix.target }}-ohd-root" \
            --version "$DT" \
            openhd/dev-release "deploy/$TAR_NAME"
            
          cloudsmith push raw --republish \
            --name "openhd-${{ matrix.target }}-ohd-root-sha256" \
            --version "$DT" \
            openhd/dev-release "deploy/$TAR_NAME.sha256"

          cloudsmith push raw --republish \\
            --name "openhd-${{ matrix.target }}-latest" \\
            --version "$DT" \\
            openhd/dev-release "deploy/$OHD_COMP"

          cloudsmith push raw --republish \\
            --name "openhd-${{ matrix.target }}-latest-sha256" \\
            --version "$DT" \\
            openhd/dev-release "deploy/$OHD_COMP.sha256"

          cloudsmith push raw --republish \\
            --name "openhd-sys-utils-${{ matrix.target }}-latest" \\
            --version "$DT" \\
            openhd/dev-release "deploy/$SYS_COMP"

          cloudsmith push raw --republish \\
            --name "openhd-sys-utils-${{ matrix.target }}-latest-sha256" \\
            --version "$DT" \\
            openhd/dev-release "deploy/$SYS_COMP.sha256"





